name: Reportar un error
description: Algo no funciona como debería.
title: "[Error] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **No incluyas datos reales de afiliados** (nombres, documentos,
        historias clínicas) ni contraseñas. Si se trata de una vulnerabilidad de seguridad, no uses
        este formulario: sigue la [política de seguridad](https://github.com/Bionica-Visions/.github/blob/main/SECURITY.md).

  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué pasó?
      description: Describe el error en pocas líneas.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ingresar a ...
        2. Hacer clic en ...
        3. Ver el error ...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true

  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Producción
        - Pruebas / staging
        - Desarrollo local
    validations:
      required: true

  - type: dropdown
    id: impacto
    attributes:
      label: Impacto
      options:
        - "Crítico: bloquea la operación o afecta a muchos afiliados"
        - "Alto: una funcionalidad importante no sirve y no hay alternativa"
        - "Medio: hay una forma de sortearlo"
        - "Bajo: detalle visual o menor"
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas de pantalla, mensajes de error o logs. Oculta cualquier dato personal antes de adjuntarlos.
      render: text

  - type: input
    id: navegador
    attributes:
      label: Navegador y dispositivo
      placeholder: "Ej.: Chrome 142 en Windows 11, Safari en iPhone"
