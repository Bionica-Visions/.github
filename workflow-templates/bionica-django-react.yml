# Plantilla de Biónica Visions para aplicaciones Django/DRF + React/Vite.
# Supone la estructura estándar: backend/, frontend/ y nginx/, cada una con su Dockerfile.
# Ajusta versiones, nombres de base de datos y build-args según el proyecto.

name: CI y publicación de imágenes

on:
  push:
    branches: [$default-branch, dev]
  pull_request:
    branches: [$default-branch, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Validar backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: bionica
          POSTGRES_USER: bionica
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bionica -d bionica"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      USE_SQLITE: "false"
      POSTGRES_DB: bionica
      POSTGRES_USER: bionica
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas
        run: pytest --tb=short -q

  frontend:
    name: Validar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=critical

      - name: ESLint
        run: npm run lint

      - name: Pruebas
        run: npm test

      # build ejecuta tsc --noEmit antes de compilar con Vite.
      - name: Build
        run: npm run build

  publish-images:
    name: Publicar imágenes en GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, nginx]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige el nombre de la imagen en minúsculas.
      - name: Nombre de la imagen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          # Vite incrusta estas variables en el build del frontend. Defínelas como
          # variables del repositorio (Settings → Secrets and variables → Actions → Variables).
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_OIDC_ENABLED=${{ vars.VITE_OIDC_ENABLED }}
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }}
            VITE_OIDC_REDIRECT_URI=${{ vars.VITE_OIDC_REDIRECT_URI }}
            VITE_OIDC_POST_LOGOUT_REDIRECT_URI=${{ vars.VITE_OIDC_POST_LOGOUT_REDIRECT_URI }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
